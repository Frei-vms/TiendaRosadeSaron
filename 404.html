<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Florería Rosa de Sarón</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:#FCF7F8;color:#2B1424;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center}
    main{max-width:28rem}
    h1{font-family:Georgia,serif;font-size:2rem;margin:0 0 .6rem}
    p{color:#6B5462;margin:0 0 1.6rem;line-height:1.55}
    a{display:inline-block;padding:.85rem 1.6rem;border-radius:999px;background:#A61B5C;color:#fff;font-weight:700;text-decoration:none}
    a:hover{background:#7C1145}
  </style>
</head>
<body>
  <main>
    <h1>No encontramos esa página</h1>
    <p>Puede que el enlace haya cambiado. Vuelve a la tienda para seguir viendo nuestros ramos y arreglos.</p>
    <a id="home" href="/">Volver a la tienda</a>
  </main>
  <script>
    // En GitHub Pages (sitio de proyecto) la tienda vive en /nombre-del-repositorio/
    (function () {
      var seg = location.pathname.split('/')[1];
      if (/\.github\.io$/.test(location.hostname) && seg) document.getElementById('home').href = '/' + seg + '/';
    })();
  </script>
</body>
</html>
