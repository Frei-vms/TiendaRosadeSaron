<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Florería Rosa de Sarón · Flores con mensaje, entregadas con cariño</title>
  <meta name="description" content="Ramos, arreglos y baúles de rosas, girasoles y más, con dedicatoria y delivery. Elige, paga por transferencia y confirma tu pedido por WhatsApp.">
  <meta name="theme-color" content="#A61B5C">
  <meta name="format-detection" content="telephone=no">

  <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, etc.).
       Al publicar la tienda, agrega también la imagen con la dirección completa, por ejemplo:
       <meta property="og:image" content="https://TU-USUARIO.github.io/tienda/img/logo.png"> -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_PY">
  <meta property="og:site_name" content="Florería Rosa de Sarón">
  <meta property="og:title" content="Florería Rosa de Sarón · Ramos y arreglos con delivery">
  <meta property="og:description" content="Elige tu ramo o arreglo, paga por transferencia y confirma tu pedido por WhatsApp.">
  <meta name="twitter:card" content="summary">

  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="Ir al inicio">
        <span class="brand-mark" id="brandMark"></span>
        <span class="brand-name" id="brandName"></span>
      </a>

      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" placeholder="Buscar ramos, rosas, arreglos" aria-label="Buscar productos" autocomplete="off" enterkeyhint="search">
      </form>

      <nav class="nav" aria-label="Principal" id="mainNav">
        <a href="#/">Inicio</a>
        <a href="#/catalogo">Catálogo</a>
        <a href="#/contacto">Contacto</a>
      </nav>

      <button class="icon-btn search-toggle" type="button" id="searchToggle" aria-expanded="false" aria-controls="searchForm" aria-label="Buscar productos">
        <svg class="ic-search" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ic-close" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <button class="cart-btn" type="button" data-action="open-cart" aria-label="Abrir carrito">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        <span class="cart-label">Carrito</span>
        <span class="cart-count" id="cartCount" aria-live="polite">0</span>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">

    <!-- INICIO + CATÁLOGO -->
    <section class="view" data-view="home">
      <div class="hero">
        <div class="hero-copy">
          <h1 id="heroTitle"></h1>
          <p id="heroText"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" id="heroCta" href="#/catalogo"></a>
            <a class="btn btn-ghost" id="heroWa" href="#" target="_blank" rel="noopener">Escribir por WhatsApp</a>
          </div>
        </div>
        <div class="hero-art" id="heroArt" aria-hidden="true"></div>
      </div>

      <ul class="perks" id="perks"></ul>

      <section class="catalog" id="catalogo" aria-labelledby="catalogTitle">
        <div class="section-head">
          <h2 id="catalogTitle"></h2>
          <p id="catalogText"></p>
        </div>

        <div class="toolbar">
          <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
          <div class="toolbar-row">
            <p class="results" id="results" aria-live="polite"></p>
            <label class="sort">
              <span>Ordenar</span>
              <select id="sortSelect" aria-label="Ordenar productos">
                <option value="default">Destacados</option>
                <option value="price-asc">Precio: menor a mayor</option>
                <option value="price-desc">Precio: mayor a menor</option>
                <option value="name">Nombre (A–Z)</option>
              </select>
            </label>
          </div>
        </div>

        <div class="grid" id="grid"></div>
      </section>

      <section class="howto" aria-labelledby="howToTitle">
        <div class="section-head">
          <h2 id="howToTitle"></h2>
          <p id="howToText"></p>
        </div>
        <ol id="howToList"></ol>
      </section>

      <section class="about">
        <h2 id="aboutTitle"></h2>
        <p id="aboutText"></p>
      </section>
    </section>

    <!-- CHECKOUT -->
    <section class="view" data-view="checkout" hidden>
      <div class="wrap" id="checkoutRoot"></div>
    </section>

    <!-- TÉRMINOS -->
    <section class="view" data-view="terminos" hidden>
      <article class="wrap legal" id="termsRoot"></article>
    </section>

    <!-- PRIVACIDAD -->
    <section class="view" data-view="privacidad" hidden>
      <article class="wrap legal" id="privacyRoot"></article>
    </section>
  </main>

  <footer class="site-footer" id="contacto">
    <div class="footer-inner">
      <div>
        <p class="footer-brand" id="footBrand"></p>
        <p class="footer-text" id="footText"></p>
      </div>
      <div>
        <p class="footer-h">Contacto</p>
        <ul class="footer-list" id="footContact"></ul>
      </div>
      <div>
        <p class="footer-h">Información</p>
        <ul class="footer-list">
          <li><a href="#/terminos">Términos y condiciones</a></li>
          <li><a href="#/privacidad">Política de privacidad</a></li>
        </ul>
        <ul class="footer-list social" id="footSocial"></ul>
      </div>
    </div>
    <p class="copyright" id="copyright"></p>
  </footer>

  <a class="wa-fab" id="waFab" href="#" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <!-- Detalle de producto -->
  <dialog id="productDialog" class="modal" aria-labelledby="pdName"></dialog>

  <!-- Carrito -->
  <dialog id="cartDrawer" class="drawer" aria-labelledby="cartTitle">
    <div class="drawer-head">
      <h2 id="cartTitle">Tu carrito</h2>
      <button type="button" class="icon-btn" data-action="close-cart" aria-label="Cerrar carrito">✕</button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
    <div class="drawer-foot" id="cartFoot"></div>
  </dialog>

  <div class="toast" id="toast" popover="manual" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem;text-align:center">Esta tienda necesita JavaScript para funcionar.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/legal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
